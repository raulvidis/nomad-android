name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # llama.cpp is built from source via CMake; the native build needs the NDK.
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew lint

      - name: Run unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew testDebugUnitTest

      # First run compiles llama.cpp from source (~10 min); CMake caches afterward.
      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./gradlew assembleDebug

      # Build artifacts are only kept for PR review; on push to main they
      # just accumulate Actions storage with no consumer.
      - name: Upload APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nomad-debug-pr${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload lint results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-pr${{ github.event.pull_request.number }}
          path: app/build/reports/lint-results-*.html
          retention-days: 7

      - name: Upload test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pr${{ github.event.pull_request.number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      # Keep a single always-current APK on the latest-build release for
      # main pushes, instead of a per-push artifact that accumulates.
      - name: Upload APK to latest release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build
          body: |
            Auto-built from latest `${{ github.event.repository.default_branch }}` commit.
            Commit: `${{ github.sha }}`
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
